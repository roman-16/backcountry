plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

var released = providers.fileContents(layout.projectDirectory.file('../CHANGELOG.md')).asText.get() =~ /(?m)^## \[(\d+\.\d+\.\d+)\] - \d{4}-\d{2}-\d{2}$/
version = released.find() ? released.group(1) : '0.0.0'
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

def heapGigabytes = (providers.fileContents(layout.projectDirectory.file('../balance.toml')).asText.get() =~ /(?ms)^\[heap\]\s*^gigabytes = (\d+)$/)[0][1]
static Provider<String> modrinth(Provider<String> packEntry) {
    packEntry.map { text -> "maven.modrinth:${(text =~ /(?m)^mod-id = "(.+)"$/)[0][1]}:${(text =~ /(?m)^version = "(.+)"$/)[0][1]}".toString() }
}

def accessories = modrinth(providers.fileContents(layout.projectDirectory.file('../pack/mods/curios.pw.toml')).asText)
def ecliptic = modrinth(providers.fileContents(layout.projectDirectory.file('../pack/mods/ecliptic-seasons.pw.toml')).asText)
def farView = modrinth(providers.fileContents(layout.projectDirectory.file('../pack/mods/distanthorizons.pw.toml')).asText)
def lookedAt = modrinth(providers.fileContents(layout.projectDirectory.file('../pack/mods/jade.pw.toml')).asText)
def recipeViewer = modrinth(providers.fileContents(layout.projectDirectory.file('../pack/mods/jei.pw.toml')).asText)
def renderer = providers.fileContents(layout.projectDirectory.file('../pack/mods/sodium.pw.toml')).asText.map { text ->
    "net.caffeinemc:sodium-neoforge-mod:${(text =~ /(?m)^filename = "sodium-neoforge-(.+)\.jar"$/)[0][1]}".toString()
}
def shaders = modrinth(providers.fileContents(layout.projectDirectory.file('../pack/mods/iris.pw.toml')).asText)
def walkInScreens = modrinth(providers.fileContents(layout.projectDirectory.file('../pack/mods/invmove.pw.toml')).asText)

sourceSets {
    dev {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    devCompileOnly.extendsFrom compileOnly
    devImplementation.extendsFrom implementation
    hotswapAgent {
        transitive = false
    }
    vineflower
}

repositories {
    maven {
        name = 'CaffeineMC'
        url = 'https://maven.caffeinemc.net/releases'
        content { includeGroup 'net.caffeinemc' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    mavenCentral {
        content {
            includeGroup 'org.hotswapagent'
            includeGroup 'org.vineflower'
        }
    }
}

static List<String> swappable(String port) {
    ['-XX:+AllowEnhancedClassRedefinition', '-XX:HotswapAgent=external', "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:${port}".toString()]
}

Provider<String> hotswapAgentArgument = configurations.hotswapAgent.elements.map { files -> "-javaagent:${files.first().asFile}".toString() }

neoForge {
    version = neo_version
    addModdingDependenciesTo sourceSets.dev

    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }

    runs {
        configureEach {
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }
        play {
            client()
            gameDirectory = file(providers.environmentVariable('BACKCOUNTRY_GAME_DIRECTORY').orElse('../build/client').get())
            jvmArgument "-Xmx${heapGigabytes}G"
            jvmArguments.addAll swappable(providers.environmentVariable('BACKCOUNTRY_SWAP_PORT').orElse(client_swap_port).get())
            jvmArguments.add hotswapAgentArgument
            programArguments.addAll '--fml.mixinConfig', "${mod_id}.dev.mixins.json", '--height', '720', '--username', 'Survivor', '--width', '1280'
            sourceSet = sourceSets.dev
            systemProperty "${mod_id}.world", providers.environmentVariable('BACKCOUNTRY_WORLD').orElse('').get()
            systemProperty "${mod_id}.seed", providers.environmentVariable('BACKCOUNTRY_SEED').orElse('').get()
            ['DISPLAY', 'XDG_SESSION_TYPE'].each { variable ->
                String value = providers.environmentVariable(variable).orNull
                if (value != null) {
                    environment.put(variable, value)
                }
            }
        }
        server {
            server()
            gameDirectory = file(providers.environmentVariable('BACKCOUNTRY_GAME_DIRECTORY').orElse('../build/devserver').get())
            jvmArgument "-Xmx${heapGigabytes}G"
            jvmArguments.addAll swappable(providers.environmentVariable('BACKCOUNTRY_SWAP_PORT').orElse(server_swap_port).get())
            jvmArguments.add hotswapAgentArgument
            programArguments.addAll '--nogui', '--fml.mixinConfig', "${mod_id}.dev.mixins.json"
            sourceSet = sourceSets.dev
            systemProperty "${mod_id}.shape", providers.environmentVariable('BACKCOUNTRY_SHAPE').orElse('').get()
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = file('../build/gametest')
            jvmArgument "-Xmx${heapGigabytes}G"
            programArguments.addAll '--fml.mixinConfig', "${mod_id}.dev.mixins.json"
            sourceSet = sourceSets.dev
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.dev)
        }
    }
}

tasks.matching { it.name == 'runServer' }.configureEach {
    standardInput = System.in
}

dependencies {
    compileOnly farView
    compileOnly lookedAt
    compileOnly recipeViewer
    compileOnly renderer
    compileOnly shaders
    compileOnly walkInScreens
    implementation accessories
    implementation ecliptic
    hotswapAgent "org.hotswapagent:hotswap-agent-core:${hotswap_agent_version}"
    vineflower "org.vineflower:vineflower:${vineflower_version}"
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

sourceSets.dev.resources {
    srcDir 'src/generated/dev'
}

var freshGameTestWorld = tasks.register('freshGameTestWorld', Delete) {
    delete '../build/gametest/world'
}

tasks.register('vineflower', Sync) {
    from configurations.vineflower
    into layout.buildDirectory.dir('vineflower')
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn freshGameTestWorld
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            loader_version_range   : loader_version_range,
            minecraft_version_range: minecraft_version_range,
            mod_id                 : mod_id,
            mod_license            : mod_license,
            mod_name               : mod_name,
            neo_version            : neo_version,
            version                : version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

processResources {
    from([rootProject.file('../balance.toml'), rootProject.file('../cuts.toml')]) {
        into 'backcountry'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:all' << '-Xlint:-classfile' << '-Werror'
}
